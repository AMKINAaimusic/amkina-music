<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMKINA MUSIC</title>

<style>
:root{
  --bg:#070707;
  --panel:#111;
  --panel2:#171717;
  --line:#242424;
  --text:#f5f5f5;
  --muted:#8b8b8b;
  --green:#9bea63;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  height:76px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:rgba(7,7,7,.94);
  backdrop-filter:blur(15px);
  z-index:10;
}

.logo{
  font-size:21px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span{color:var(--green)}

nav{
  display:flex;
  gap:30px;
}

nav a{
  color:#999;
  text-decoration:none;
  font-size:12px;
  letter-spacing:2px;
}

nav a:hover{color:white}

.hero{
  min-height:430px;
  padding:90px 7% 60px;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 75% 30%,
    rgba(155,234,99,.10),transparent 30%);
}

.hero-label{
  color:var(--green);
  letter-spacing:4px;
  font-size:11px;
  font-weight:bold;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(48px,7vw,100px);
  line-height:.95;
  letter-spacing:-4px;
}

.hero p{
  color:#888;
  margin-top:24px;
  letter-spacing:2px;
  font-size:13px;
}

main{
  padding:20px 7% 100px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:28px;
}

.section-header h2{
  margin:0;
  font-size:25px;
}

.section-header span{
  color:#666;
  font-size:12px;
}

.music-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  gap:26px;
}

.track{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px;
  transition:.25s ease;
  overflow:hidden;
}

.track:hover{
  transform:translateY(-6px);
  background:var(--panel2);
  border-color:#3a3a3a;
}

.cover-wrap{
  position:relative;
}

.cover{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:11px;
  display:block;
  background:#161616;
}

.badge{
  position:absolute;
  top:10px;
  left:10px;
  padding:6px 9px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.15);
  border-radius:20px;
  font-size:9px;
  letter-spacing:1px;
}

.info{
  padding:15px 3px 5px;
}

.title{
  font-size:17px;
  font-weight:700;
  margin-bottom:7px;
}

.artist{
  color:#888;
  font-size:13px;
}

.meta{
  margin-top:8px;
  color:#5f5f5f;
  font-size:11px;
}

audio{
  width:100%;
  margin-top:16px;
  height:38px;
}

.loading{
  color:#777;
  padding:30px 0;
}

footer{
  padding:40px 7%;
  border-top:1px solid var(--line);
  color:#555;
  font-size:11px;
  letter-spacing:1px;
  display:flex;
  justify-content:space-between;
}

@media(max-width:650px){

  header{
    padding:0 5%;
  }

  nav{
    display:none;
  }

  .hero{
    min-height:330px;
    padding:60px 5%;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  main{
    padding:10px 5% 70px;
  }

  .music-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .track{
    border-radius:13px;
    padding:9px;
  }

  .title{
    font-size:14px;
  }

  audio{
    height:34px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    AMKINA <span>MUSIC</span>
  </div>

  <nav>
    <a href="#">HOME</a>
    <a href="#music">MUSIC</a>
    <a href="#about">ABOUT</a>
  </nav>

</header>


<section class="hero">

  <div>

    <div class="hero-label">
      INDEPENDENT MUSIC
    </div>

    <h1>
      SOUND<br>
      WITHOUT<br>
      BOUNDARIES.
    </h1>

    <p>
      ORIGINAL MUSIC · AMKINA
    </p>

  </div>

</section>


<main id="music">

  <div class="section-header">

    <h2>Latest Releases</h2>

    <span id="track-count">
      Loading...
    </span>

  </div>

  <div id="music-list" class="music-grid">

    <div class="loading">
      음악을 불러오는 중...
    </div>

  </div>

</main>


<footer id="about">

  <div>
    © 2026 AMKINA MUSIC
  </div>

  <div>
    INDEPENDENT MUSIC CREATOR
  </div>

</footer>


<script>

const SUPABASE_URL =
"https://bbtzasddvodrprpnbeos.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_0xwgASnyXne6PdTKMbh6MQ_oleIl594";

const API =
SUPABASE_URL +
"/rest/v1/tracks?select=*&order=id.desc";


async function loadMusic(){

  const container =
    document.getElementById("music-list");

  const counter =
    document.getElementById("track-count");

  try{

    const response = await fetch(API,{
      headers:{
        apikey:SUPABASE_ANON_KEY,
        Authorization:
          "Bearer " + SUPABASE_ANON_KEY
      }
    });

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    const tracks =
      await response.json();

    counter.textContent =
      tracks.length + " RELEASES";

    container.innerHTML="";

    if(!tracks.length){

      container.innerHTML =
        '<div class="loading">등록된 음악이 없습니다.</div>';

      return;
    }


    tracks.forEach(track=>{

      const card =
        document.createElement("article");

      card.className="track";

      const genre =
        track.genre || "ORIGINAL";

      const release =
        track.release_date || "";

      card.innerHTML = `

        <div class="cover-wrap">

          <img
            class="cover"
            src="${track.cover_url || ''}"
            alt="${track.title || 'AMKINA'}">

          <div class="badge">
            ${genre}
          </div>

        </div>


        <div class="info">

          <div class="title">
            ${track.title || "Untitled"}
          </div>

          <div class="artist">
            ${track.artist || "AMKINA"}
          </div>

          <div class="meta">
            ${release}
          </div>

          <audio
            controls
            preload="metadata"
            src="${track.audio_url}">
          </audio>

        </div>

      `;

      container.appendChild(card);

    });


  }catch(error){

    console.error(error);

    counter.textContent="";

    container.innerHTML =
      '<div class="loading">음악을 불러오지 못했습니다.</div>';

  }

}

loadMusic();

</script>

</body>
</html>
