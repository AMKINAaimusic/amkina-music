<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMKINA MUSIC</title>

<style>
:root{
  --bg:#070707;
  --card:#111;
  --line:#242424;
  --text:#f7f7f7;
  --muted:#888;
  --accent:#a3ff68;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:105px;
}

header{
  height:72px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,7,7,.94);
  backdrop-filter:blur(15px);
}

.logo{
  font-weight:900;
  letter-spacing:4px;
  font-size:20px;
}

.logo span{color:var(--accent)}

nav{
  display:flex;
  gap:28px;
}

nav a{
  color:#888;
  text-decoration:none;
  font-size:11px;
  letter-spacing:2px;
}

nav a:hover{color:white}

.hero{
  min-height:390px;
  padding:75px 6%;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 75% 30%,
    rgba(163,255,104,.12),transparent 28%);
}

.hero-small{
  color:var(--accent);
  font-size:10px;
  letter-spacing:4px;
  font-weight:bold;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:clamp(45px,7vw,92px);
  line-height:.92;
  letter-spacing:-4px;
}

.hero p{
  color:#777;
  letter-spacing:2px;
  font-size:12px;
  margin-top:25px;
}

main{
  padding:30px 6% 80px;
}

.section-top{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:25px;
}

.section-top h2{
  margin:0;
  font-size:25px;
}

#track-count{
  color:#666;
  font-size:11px;
  letter-spacing:1px;
}

.music-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(210px,1fr));
  gap:24px;
}

.track{
  background:var(--card);
  border:1px solid var(--line);
  padding:12px;
  border-radius:16px;
  cursor:pointer;
  transition:.25s;
}

.track:hover{
  transform:translateY(-5px);
  border-color:#444;
}

.cover-wrap{
  position:relative;
}

.cover{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:10px;
  display:block;
}

.play-circle{
  width:52px;
  height:52px;
  border-radius:50%;
  border:0;
  position:absolute;
  right:12px;
  bottom:12px;
  background:var(--accent);
  color:#050505;
  font-size:20px;
  cursor:pointer;
  opacity:0;
  transform:translateY(5px);
  transition:.2s;
}

.track:hover .play-circle{
  opacity:1;
  transform:none;
}

.info{
  padding:14px 3px 5px;
}

.title{
  font-weight:700;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  color:#888;
  font-size:12px;
  margin-top:6px;
}

.meta{
  color:#555;
  font-size:10px;
  margin-top:7px;
  text-transform:uppercase;
}

.loading{
  color:#777;
  padding:30px 0;
}

/* PLAYER */

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:90px;
  z-index:50;
  background:rgba(15,15,15,.97);
  border-top:1px solid #292929;
  display:grid;
  grid-template-columns:1fr 1.4fr 1fr;
  align-items:center;
  padding:10px 5%;
  backdrop-filter:blur(20px);
}

.now{
  display:flex;
  align-items:center;
  min-width:0;
}

.now img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:7px;
  margin-right:13px;
  background:#222;
}

.now-text{
  min-width:0;
}

#now-title{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#now-artist{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.controls{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.buttons{
  display:flex;
  align-items:center;
  gap:20px;
}

.control-btn{
  background:none;
  border:0;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.main-play{
  width:42px;
  height:42px;
  border-radius:50%;
  background:white;
  color:black;
  border:0;
  font-size:17px;
  cursor:pointer;
}

.progress-row{
  width:100%;
  max-width:500px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:7px;
}

.time{
  color:#666;
  font-size:9px;
  width:32px;
}

#progress{
  flex:1;
  accent-color:var(--accent);
}

.volume{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:10px;
  color:#777;
  font-size:12px;
}

#volume{
  width:90px;
  accent-color:var(--accent);
}

footer{
  border-top:1px solid var(--line);
  padding:35px 6%;
  color:#555;
  font-size:10px;
  letter-spacing:1px;
}

@media(max-width:700px){

  nav{display:none}

  header{padding:0 4%}

  .hero{
    min-height:310px;
    padding:55px 5%;
  }

  .hero h1{
    letter-spacing:-2px;
  }

  main{
    padding:20px 4% 70px;
  }

  .music-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .track{
    padding:8px;
    border-radius:12px;
  }

  .play-circle{
    opacity:1;
    width:42px;
    height:42px;
  }

  .title{font-size:13px}

  .player{
    height:82px;
    grid-template-columns:1fr auto;
    padding:8px 3%;
  }

  .now img{
    width:50px;
    height:50px;
  }

  .progress-row,
  .volume,
  .control-btn{
    display:none;
  }

  .buttons{
    gap:8px;
  }

  .main-play{
    width:44px;
    height:44px;
  }

  body{
    padding-bottom:95px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">AMKINA <span>MUSIC</span></div>

  <nav>
    <a href="#">HOME</a>
    <a href="#music">MUSIC</a>
    <a href="#about">ABOUT</a>
  </nav>
</header>

<section class="hero">
  <div>
    <div class="hero-small">AMKINA ORIGINAL SOUND</div>

    <h1>
      MUSIC<br>
      WITHOUT<br>
      LIMITS.
    </h1>

    <p>AI · SOUND · ORIGINALITY</p>
  </div>
</section>

<main id="music">

  <div class="section-top">
    <h2>Latest Releases</h2>
    <div id="track-count">LOADING</div>
  </div>

  <div id="music-list" class="music-grid">
    <div class="loading">음악을 불러오는 중...</div>
  </div>

</main>

<footer id="about">
  © 2026 AMKINA MUSIC · ORIGINAL MUSIC PLATFORM
</footer>


<div class="player">

  <div class="now">

    <img id="now-cover" alt="cover">

    <div class="now-text">
      <div id="now-title">Select a track</div>
      <div id="now-artist">AMKINA MUSIC</div>
    </div>

  </div>


  <div class="controls">

    <div class="buttons">

      <button
        class="control-btn"
        onclick="previousTrack()">
        ◀
      </button>

      <button
        id="main-play"
        class="main-play"
        onclick="togglePlay()">
        ▶
      </button>

      <button
        class="control-btn"
        onclick="nextTrack()">
        ▶▶
      </button>

    </div>

    <div class="progress-row">

      <span id="current-time" class="time">
        0:00
      </span>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0">

      <span id="duration-time" class="time">
        0:00
      </span>

    </div>

  </div>


  <div class="volume">

    VOL

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.8">

  </div>

</div>


<audio id="audio"></audio>


<script>

const SUPABASE_URL =
"https://bbtzasddvodrprpnbeos.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_0xwgASnyXne6PdTKMbh6MQ_oleIl594";

const API =
SUPABASE_URL +
"/rest/v1/tracks?select=*&order=id.desc";


let tracks=[];
let currentIndex=-1;

const audio =
document.getElementById("audio");

const playButton =
document.getElementById("main-play");

const progress =
document.getElementById("progress");

const volume =
document.getElementById("volume");


function safe(value){
  return value ?? "";
}


async function loadMusic(){

  const container =
    document.getElementById("music-list");

  try{

    const response =
      await fetch(API,{
        headers:{
          apikey:SUPABASE_ANON_KEY,
          Authorization:
            "Bearer " + SUPABASE_ANON_KEY
        }
      });

    if(!response.ok){
      throw new Error(
        "HTTP " + response.status
      );
    }

    tracks =
      await response.json();

    document.getElementById(
      "track-count"
    ).textContent =
      tracks.length + " RELEASES";

    container.innerHTML="";

    if(!tracks.length){

      container.innerHTML =
        '<div class="loading">등록된 음악이 없습니다.</div>';

      return;
    }


    tracks.forEach((track,index)=>{

      const card =
        document.createElement("article");

      card.className="track";

      card.innerHTML=`

        <div class="cover-wrap">

          <img
            class="cover"
            src="${safe(track.cover_url)}"
            alt="${safe(track.title)}">

          <button
            class="play-circle"
            aria-label="Play">
            ▶
          </button>

        </div>

        <div class="info">

          <div class="title">
            ${safe(track.title) || "Untitled"}
          </div>

          <div class="artist">
            ${safe(track.artist) || "AMKINA"}
          </div>

          <div class="meta">
            ${safe(track.genre) || "ORIGINAL"}
            ${track.release_date
              ? " · " + track.release_date
              : ""}
          </div>

        </div>
      `;

      card.addEventListener(
        "click",
        ()=>playTrack(index)
      );

      container.appendChild(card);

    });

  }

  catch(error){

    console.error(error);

    container.innerHTML =
      '<div class="loading">음악을 불러오지 못했습니다.</div>';

  }

}


function playTrack(index){

  if(!tracks[index]) return;

  currentIndex=index;

  const track=tracks[index];

  audio.src=track.audio_url;

  document.getElementById(
    "now-cover"
  ).src=track.cover_url || "";

  document.getElementById(
    "now-title"
  ).textContent=
    track.title || "Untitled";

  document.getElementById(
    "now-artist"
  ).textContent=
    track.artist || "AMKINA";

  audio.play();
fetch(SUPABASE_URL + "/rest/v1/rpc/increment_play_count", {
  method: "POST",
  headers: {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    track_id: track.id
  })
}).then(() => {
  track.play_count = (track.play_count || 0) + 1;
});
}


function togglePlay(){

  if(currentIndex===-1){

    if(tracks.length){
      playTrack(0);
    }

    return;
  }

  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }

}


function previousTrack(){

  if(!tracks.length) return;

  let next =
    currentIndex <= 0
      ? tracks.length-1
      : currentIndex-1;

  playTrack(next);

}


function nextTrack(){

  if(!tracks.length) return;

  let next =
    currentIndex >= tracks.length-1
      ? 0
      : currentIndex+1;

  playTrack(next);

}


function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }

  const m =
    Math.floor(seconds/60);

  const s =
    Math.floor(seconds%60)
      .toString()
      .padStart(2,"0");

  return m+":"+s;

}


audio.addEventListener(
  "play",
  ()=>{
    playButton.textContent="❚❚";
  }
);


audio.addEventListener(
  "pause",
  ()=>{
    playButton.textContent="▶";
  }
);


audio.addEventListener(
  "ended",
  nextTrack
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    if(!audio.duration) return;

    progress.value =
      (audio.currentTime /
       audio.duration)*100;

    document.getElementById(
      "current-time"
    ).textContent =
      formatTime(audio.currentTime);

    document.getElementById(
      "duration-time"
    ).textContent =
      formatTime(audio.duration);

  }
);


progress.addEventListener(
  "input",
  ()=>{

    if(!audio.duration) return;

    audio.currentTime =
      (progress.value/100) *
      audio.duration;

  }
);


volume.addEventListener(
  "input",
  ()=>{
    audio.volume=volume.value;
  }
);


audio.volume=.8;

loadMusic();

</script>

</body>
</html>
